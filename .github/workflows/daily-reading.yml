name: 示例 · 每日英语精读

# 例 ①：抓 China Daily 一篇 → 大模型出词汇/语法 → 出 Word → 发信。
# 这是本仓库最完整的一个任务，负责定时、保活、Artifact 备份。
# 想改成自己的任务：复制本文件 → 改 name / cron / 最后一行脚本路径。

on:
  # 默认只支持手动触发：模板仓库/刚 fork 的仓库还没有 Secrets，
  # 如果直接开着定时，会每天报红（或给模板作者发重复邮件）。
  # ✅ 配好 Secrets 并手动跑通一次后，把下面两行的注释去掉即可开启每日自动运行。
  workflow_dispatch:
  # schedule:
  #   - cron: '0 23 * * *'      # 北京时间每天 07:00 = UTC 23:00（GitHub 按 UTC 计时）

permissions:
  contents: write

concurrency:
  group: daily-reading
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai   # 让脚本按北京时间取日期
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成精读文档并发送邮件
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python main.py

      - name: 备份 Word 文件（Artifact，可下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-docx
          path: output/*.docx
          if-no-files-found: ignore
          retention-days: 30

      - name: 保活提交 + 记录上一篇（避免 60 天无活动被停用 / 避免次日重复推同一篇）
        if: always()
        run: |
          git config user.name "push-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .state
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .state/last-run.txt
          git add .state/last-run.txt
          # 脚本若成功发送，会写入 .state/last_article.txt（记录本篇链接）
          git add .state/last_article.txt 2>/dev/null || true
          git commit -m "chore: keep-alive $(date -u +%F)" || echo "nothing to commit"
          git push || echo "push skipped"
